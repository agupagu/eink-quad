<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ede9de"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="The Quad"><title>The Quad · Live sports</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#142027;background:#ede9de}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.shell{height:100%;display:flex;flex-direction:column;gap:10px}.top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 7px}.brand{font-size:20px;font-weight:850;letter-spacing:-.055em}.brand em{font-style:normal;color:#a01d29}.meta{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#687178;font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#318071;margin-right:7px}.dot.off{background:#bd6a44}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}.card{--accent:#152537;appearance:none;border:1px solid #dad7cd;background:#fcfaf4;border-radius:18px;text-align:left;color:inherit;padding:clamp(15px,2vw,25px);min-height:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 9px #1b2b3210;touch-action:manipulation;cursor:pointer}.card:active{transform:scale(.996)}.card:focus-visible{outline:3px solid var(--accent)}.card[data-key=man_utd]{--accent:#a52131}.card[data-key=india_men]{--accent:#1957a2}.card[data-key=f1]{--accent:#d63a2c}.card[data-key=cal_fb]{--accent:#b58124}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{border:1px solid currentColor;border-radius:40px;padding:4px 9px;font-size:10px;letter-spacing:.1em;white-space:nowrap}.card h2{font-size:clamp(23px,3vw,36px);line-height:1.04;letter-spacing:-.06em;margin:13px 0 0;font-weight:850}.hero{font-size:clamp(19px,2.4vw,30px);font-weight:700;letter-spacing:-.045em;line-height:1.13;margin-top:clamp(20px,4vh,50px);max-width:95%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sub{font-size:clamp(12px,1.4vw,16px);font-weight:600;color:#5c666a;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rule{height:1px;background:#e3e2d9;margin:auto 0 10px}.foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#59646a}.foot b{color:#26343b;white-space:nowrap}.foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{position:fixed;inset:0;background:#ede9de;padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}.detail[hidden]{display:none}.detail-top{display:flex;justify-content:space-between;align-items:center}.back{border:1px solid #c9c9be;border-radius:12px;background:#fffdf8;padding:12px 17px;font-size:16px;font-weight:700;color:#16242d}.detail .hint{color:#78827f;font-size:13px}.detail-body{background:#fcfaf4;border:1px solid #dad7cd;border-radius:24px;padding:clamp(24px,5vw,65px);flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}.detail-label{font-size:15px;font-weight:800;letter-spacing:.16em;color:#697477;text-transform:uppercase}.detail h1{font-size:clamp(42px,7vw,86px);line-height:.98;letter-spacing:-.07em;margin:20px 0 45px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.detail-grid section{border-top:2px solid #ced4cf;padding-top:15px}.detail-grid h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#697477}.detail-grid strong{font-size:clamp(22px,3vw,38px);letter-spacing:-.05em;display:block;margin:16px 0}.detail-grid p{font-size:clamp(15px,2vw,22px);color:#4d5a60;margin:0}.status{position:absolute;right:20px;bottom:8px;font-size:12px;color:#915739}.status:empty{display:none}@media(max-width:700px){.top{height:42px}.brand{font-size:18px}.meta{font-size:10px}.grid{gap:7px}.card{padding:11px;border-radius:12px}.card h2{font-size:21px;margin-top:7px}.hero{font-size:18px}.sub{font-size:11px}.rule{margin:8px 0 5px}.foot{font-size:10px}.detail-grid{grid-template-columns:1fr;gap:15px}.detail h1{margin:10px 0 18px}}@media(max-height:600px){.top{height:32px}.card h2{margin:5px 0}.rule{margin:7px 0 4px}.card{padding:10px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">the <em>quad_</em></div><div class="meta"><span class="dot" id="dot"></span><span id="clock">SINGAPORE</span> · <span id="updated">CONNECTING</span></div></header><main class="grid" aria-label="Four sports"> <button class="card" data-key="man_utd" type="button"><span class="eyebrow">01 / FOOTBALL <span class="tag" data-field="badge">UPCOMING</span></span><h2>Manchester United</h2><span class="hero" data-field="hero">Loading fixtures…</span><span class="sub" data-field="sub"></span><span class="rule"></span><span class="foot"><b>PREVIOUS</b><span data-field="foot"></span></span></button><button class="card" data-key="india_men" type="button"><span class="eyebrow">02 / CRICKET <span class="tag" data-field="badge">UPCOMING</span></span><h2>India Men</h2><span class="hero" data-field="hero">Loading fixtures…</span><span class="sub" data-field="sub"></span><span class="rule"></span><span class="foot"><b>PREVIOUS</b><span data-field="foot"></span></span></button><button class="card" data-key="f1" type="button"><span class="eyebrow">03 / MOTORSPORT <span class="tag" data-field="badge">UPCOMING</span></span><h2>Formula 1</h2><span class="hero" data-field="hero">Loading calendar…</span><span class="sub" data-field="sub"></span><span class="rule"></span><span class="foot"><b>PREVIOUS</b><span data-field="foot"></span></span></button><button class="card" data-key="cal_fb" type="button"><span class="eyebrow">04 / COLLEGE FOOTBALL <span class="tag" data-field="badge">UPCOMING</span></span><h2>Cal Bears</h2><span class="hero" data-field="hero">Loading fixtures…</span><span class="sub" data-field="sub"></span><span class="rule"></span><span class="foot"><b>PREVIOUS</b><span data-field="foot"></span></span></button></main></div><div class="detail" id="detail" hidden><div class="detail-top"><button class="back" type="button" id="back">← All four</button><span class="hint">SWIPE TO SWITCH · TAP BACK FOR THE QUAD</span></div><div class="detail-body"><span class="detail-label" id="detail-label"></span><h1 id="detail-title"></h1><div class="detail-grid"><section><h3>NOW / NEXT</h3><strong id="detail-next"></strong><p id="detail-next-sub"></p></section><section><h3>LAST RESULT</h3><strong id="detail-last"></strong><p id="detail-last-sub"></p></section></div></div></div><div class="status" id="status" role="status"></div>
<script>
'use strict';const keys=['man_utd','india_men','f1','cal_fb'],key=new URLSearchParams(location.search).get('k')||'';const nodes=new Map([...document.querySelectorAll('.card')].map(el=>[el.dataset.key,el]));const detail=document.getElementById('detail'),status=document.getElementById('status');let items=new Map(),signatures=new Map(),selected=null,timer=null,busy=false;
const fmt=(ts,opts)=>new Intl.DateTimeFormat('en-SG',{timeZone:'Asia/Singapore',...opts}).format(new Date(ts*1000));const when=(g)=>g?fmt(g.start,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';const score=(g)=>g?.us!=null&&g?.them!=null?`${g.us}–${g.them}`:g?.detail||'';const set=(el,v)=>{v=String(v??'');if(el.textContent!==v)el.textContent=v};
function fields(row){const live=row.live,next=row.next,last=row.last;let badge=live?'LIVE':next?'NEXT':'IDLE',hero='',sub='',foot='';if(row.key==='f1'){hero=(live||next||last)?.opponent||'No race listed';sub=live?'Race weekend underway':next?'Weekend begins '+when(next):'No upcoming race';foot=last?'Previous: '+last.opponent:'Season calendar'}else if(row.key==='india_men'){hero=live?`${live.opponent} · ${live.detail||'Live'}`:next?`India vs ${next.opponent}`:'No active India fixture';sub=live?live.note:next?when(next)+' · '+next.note:'Active-series feed has no India match';foot=last?`Last: ${last.opponent} · ${last.detail||'Final'}`:'New fixtures appear when series enters active feed'}else{hero=live?`${score(live)} vs ${live.opponent}`:next?`vs ${next.opponent}`:last?`${score(last)} vs ${last.opponent}`:'No upcoming match';sub=live?live.detail:next?when(next):last?`Last result · ${when(last)}`:'';foot=last?`${score(last)} ${last.opponent}`:row.record||'Awaiting result'}return {badge,hero,sub,foot}}
function draw(row){const el=nodes.get(row.key);if(!el)return;const f=fields(row),sig=JSON.stringify(f);if(signatures.get(row.key)===sig)return;signatures.set(row.key,sig);set(el.querySelector('.foot b'),row.last?'PREVIOUS':'FEED');for(const [name,value] of Object.entries(f))set(el.querySelector(`[data-field=${name}]`),value)}
function show(key){if(!keys.includes(key))return;selected=key;detail.hidden=false;drawDetail();history.replaceState(null,'','#'+key)}function home(){selected=null;detail.hidden=true;history.replaceState(null,'',location.pathname+location.search)}
function drawDetail(){const row=items.get(selected);if(!row)return;const next=row.live||row.next,last=row.last;set(document.getElementById('detail-label'),row.key==='f1'?'MOTORSPORT / FORMULA 1':row.key==='india_men'?'CRICKET / INDIA MEN':row.key==='man_utd'?'FOOTBALL / PREMIER LEAGUE':'COLLEGE FOOTBALL / CAL');set(document.getElementById('detail-title'),row.label);set(document.getElementById('detail-next'),next?row.key==='f1'?next.opponent:row.key==='india_men'?`India vs ${next.opponent}`:`${next.home?'vs':'at'} ${next.opponent}`:'No scheduled match in feed');set(document.getElementById('detail-next-sub'),next?`${row.key==='f1'?'Weekend begins ':''}${when(next)}${next.detail&&next.state==='in'?' · '+next.detail:''}${next.note?' · '+next.note:''}`:row.key==='india_men'?'ESPN active-series feed has no India match right now.':'Check back for the next fixture.');set(document.getElementById('detail-last'),last?row.key==='f1'?last.opponent:row.key==='india_men'?`India vs ${last.opponent}`:`${score(last)} vs ${last.opponent}`:'No recent result in feed');set(document.getElementById('detail-last-sub'),last?`${when(last)}${last.detail?' · '+last.detail:''}`:'')}
function schedule(){clearTimeout(timer);if(!document.hidden)timer=setTimeout(refresh,30000)}async function refresh(){if(busy)return;busy=true;try{const params=new URLSearchParams();if(key)params.set('k',key);const r=await fetch('/api/tablet/sports?'+params,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();for(const row of data.sports||[]){items.set(row.key,row);draw(row)}if(selected)drawDetail();set(document.getElementById('updated'),'DATA SYNCED');document.getElementById('dot').classList.remove('off');status.textContent=''}catch(e){set(document.getElementById('updated'),'OFFLINE');document.getElementById('dot').classList.add('off');status.textContent='Reconnecting…'}finally{busy=false;schedule()}}
for(const [k,el] of nodes)el.addEventListener('click',()=>show(k));document.getElementById('back').addEventListener('click',home);document.addEventListener('keydown',e=>{if(e.key==='Escape')home();else if(selected&&['ArrowLeft','ArrowRight'].includes(e.key))show(keys[(keys.indexOf(selected)+(e.key==='ArrowRight'?1:keys.length-1))%keys.length])});let touchX=null;detail.addEventListener('touchstart',e=>{if(e.touches.length===1)touchX=e.touches[0].clientX},{passive:true});detail.addEventListener('touchend',e=>{if(touchX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>75&&selected)show(keys[(keys.indexOf(selected)+(dx<0?1:keys.length-1))%keys.length])},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else refresh()});function clock(){set(document.getElementById('clock'),fmt(Date.now()/1000,{weekday:'short',hour:'numeric',minute:'2-digit'}))}clock();setInterval(clock,60000);if(keys.includes(location.hash.slice(1)))show(location.hash.slice(1));refresh();
</script></body></html>
