<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#171713"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Quad Board"><title>Quad Board</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#171713;color:#f5f0e3;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}main{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:8px}#display{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}#frame{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}nav{display:flex;flex-shrink:0;gap:5px;justify-content:center;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}button{border:1px solid #67645c;background:#252620;color:#f5f0e3;border-radius:11px;min-width:68px;min-height:44px;padding:8px 14px;white-space:nowrap;font:600 15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:manipulation}button.active{background:#f5f0e3;color:#171713}button:focus-visible{outline:3px solid #d5a758}#status{position:absolute;top:max(5px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));font-size:12px;background:#171713bb;border-radius:4px;padding:2px 5px}#status:empty{display:none}@media(max-width:560px){button{min-width:51px;padding:8px 10px;font-size:13px}nav{justify-content:flex-start;width:100%}}
</style></head><body><main><div id="display"><img id="frame" alt="Quad Board screen"></div><nav aria-label="Screens"><button type="button" data-page="quad">Home</button><button type="button" data-page="weather">Weather</button><button type="button" data-page="news">News</button><button type="button" data-page="sports">Sports</button><button type="button" data-page="sky">Sky</button></nav></main><small id="status" role="status"></small>
<script>
'use strict';
const key=new URLSearchParams(location.search).get('k')||'';
const pages=['quad','weather','news','sports','sky'];
const img=document.getElementById('frame'),status=document.getElementById('status');
const cache=new Map();let page='quad',activeRequest=null,timer=null;
function schedule(){clearTimeout(timer);if(!document.hidden)timer=setTimeout(refresh,15000)}
function select(next){if(!pages.includes(next))return;page=next;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-pressed',b.dataset.page===page?'true':'false')});const saved=cache.get(page);if(saved)img.src=saved.url;status.textContent=saved?'':'Loading…';if(activeRequest)activeRequest.abort();refresh()}
async function refresh(){clearTimeout(timer);if(activeRequest)activeRequest.abort();const wanted=page,controller=new AbortController();activeRequest=controller;const previous=cache.get(wanted);let blobUrl='';try{const params=new URLSearchParams({page:wanted});if(key)params.set('k',key);if(previous)params.set('v',previous.version);const response=await fetch('/api/tablet/frame?'+params,{cache:'no-store',signal:controller.signal});if(response.status===204){status.textContent='';return}if(!response.ok)throw Error('HTTP '+response.status);const version=response.headers.get('X-Version')||'';blobUrl=URL.createObjectURL(await response.blob());await new Promise((resolve,reject)=>{const preload=new Image();preload.onload=resolve;preload.onerror=reject;preload.src=blobUrl});if(controller.signal.aborted){URL.revokeObjectURL(blobUrl);return}const old=cache.get(wanted);cache.set(wanted,{version,url:blobUrl});if(wanted===page){img.src=blobUrl;status.textContent=''}if(old)URL.revokeObjectURL(old.url)}catch(error){if(blobUrl)URL.revokeObjectURL(blobUrl);if(error.name!=='AbortError')status.textContent='Offline · retrying'}finally{if(activeRequest===controller){activeRequest=null;schedule()}}}
document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>select(button.dataset.page)));
let touchX=null;document.getElementById('display').addEventListener('touchstart',e=>{if(e.touches.length===1)touchX=e.touches[0].clientX},{passive:true});document.getElementById('display').addEventListener('touchend',e=>{if(touchX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>70)select(pages[Math.max(0,Math.min(pages.length-1,pages.indexOf(page)+(dx<0?1:-1)))])},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);if(activeRequest)activeRequest.abort()}else refresh()});window.addEventListener('pageshow',()=>refresh());
select('quad');
</script></body></html>
